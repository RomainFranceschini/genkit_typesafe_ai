name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ['3.13.3', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - name: Install dependencies
        run: dart pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test example tool
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Run offline tests
        run: dart test --exclude-tags live
      - name: Compile browser smoke check
        run: dart compile js tool/web_compile_check.dart -o "$RUNNER_TEMP/web_check.js"
      - name: Validate package archive
        run: dart pub publish --dry-run
